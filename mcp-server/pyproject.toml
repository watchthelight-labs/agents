[project]
name = "bash-memory-mcp"
version = "0.3.0"
description = "Private, source-grounded memory library for Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.35,<1",
    "cryptography>=42",
    "pyjwt[crypto]>=2.9,<3",
]

[project.scripts]
memory-mcp = "memory_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
