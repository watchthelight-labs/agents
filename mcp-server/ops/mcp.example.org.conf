limit_req_zone $binary_remote_addr zone=memory_mcp:10m rate=10r/s;

server {
    listen 80;
    server_name mcp.example.org;
    location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://mcp.example.org$request_uri; }
}

server {
    listen 443 ssl;
    server_name mcp.example.org;
    ssl_certificate /etc/letsencrypt/live/mcp.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    access_log off;

    location / {
        limit_req zone=memory_mcp burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
