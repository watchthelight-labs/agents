# dash.example.org: Cloudflare (Access + per-hostname origin pulls) -> this vhost -> SPA + /api on 127.0.0.1:8092.
# Only Cloudflare can complete the TLS handshake: it must present the client certificate signed by our origin-pull CA.
limit_req_zone $binary_remote_addr zone=memory_dash:10m rate=20r/s;

server {
    listen 443 ssl;
    server_name dash.example.org;
    ssl_certificate /etc/ssl/memory-dash/origin.pem;
    ssl_certificate_key /etc/ssl/memory-dash/origin.key;
    ssl_client_certificate /etc/ssl/memory-dash/aop-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    access_log off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /srv/memory-mcp/app/dash-ui/dist;

    location /api/ {
        limit_req zone=memory_dash burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
